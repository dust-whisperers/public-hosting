<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b1710"/>
      <stop offset="100%" stop-color="#131009"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg-grad)"/>

  <!-- Gold rule top -->
  <line x1="80" y1="68" x2="432" y2="68" stroke="#c4965a" stroke-width="0.8" opacity="0.35"/>

  <!-- Inner arc: baseline y=200, peak ~120 -->
  <path d="M176,200 Q256,120 336,200"
        fill="none" stroke="#c4965a" stroke-width="4.8" stroke-linecap="round"/>
  <!-- Middle arc -->
  <path d="M124,200 Q256,95 388,200"
        fill="none" stroke="#c4965a" stroke-width="3.0" stroke-linecap="round" opacity="0.55"/>
  <!-- Outer arc: peak y=50 -->
  <path d="M68,200 Q256,50 444,200"
        fill="none" stroke="#c4965a" stroke-width="1.6" stroke-linecap="round" opacity="0.22"/>

  <!-- THE -->
  <text x="256" y="244" text-anchor="middle"
        font-family="'DM Sans',system-ui,sans-serif"
        font-size="22" font-weight="400" letter-spacing="10"
        fill="#c4965a">&#9670;  THE  &#9670;</text>

  <!-- DUST -->
  <text x="256" y="338" text-anchor="middle"
        font-family="'Cormorant Garamond',Georgia,serif"
        font-size="84" font-weight="300" letter-spacing="6"
        fill="#e9e0d3">DUST</text>

  <!-- WHISPERERS -->
  <text x="256" y="400" text-anchor="middle"
        font-family="'Cormorant Garamond',Georgia,serif"
        font-size="50" font-weight="300" letter-spacing="4"
        fill="#e9e0d3">WHISPERERS</text>

  <!-- Gold rule bottom -->
  <line x1="80" y1="432" x2="432" y2="432" stroke="#c4965a" stroke-width="0.8" opacity="0.35"/>
</svg>